[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "naga-control"
version = "0.1.3"
description = "Linux control service and Qt UI for the Razer Naga V3 Pro"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "dbus-next>=0.2.3,<0.3",
  "evdev>=2,<3",
  "PySide6>=6.8,<7",
  "pyudev>=0.24,<1",
  "tomli-w>=1.2,<2",
]

[project.scripts]
naga-control-capture = "naga_control.diagnostics.capture_cli:main"
naga-control-service = "naga_control.service.service_cli:main"
naga-control-gui = "naga_control.gui.app:main"
naga-control-integration = "naga_control.integration_cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not hardware'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "hardware: requires an explicitly selected physical Naga V3 Pro",
  "integration: crosses an adapter boundary without requiring real hardware",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
