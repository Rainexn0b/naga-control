name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Build + Upload AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps for headless Qt and AppImage packing
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 squashfs-tools file pkg-config libdbus-1-dev libglib2.0-dev

      - name: Prepare build venv used by build-appimage.sh
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Validate tag and prepare version-specific release notes
        id: prepare
        run: |
          .venv/bin/python scripts/prepare_release.py "$GITHUB_REF_NAME" \
            --notes-output "$RUNNER_TEMP/release-notes.md"

      - name: Run standard checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
          .venv/bin/pyright scripts/prepare_release.py
          .venv/bin/pytest

      - name: Build AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: packaging/appimage/build-appimage.sh

      - name: Verify bundled package version
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          PYTHONHOME="$PWD/build/appimage/AppDir/usr" \
          LD_LIBRARY_PATH="$PWD/build/appimage/AppDir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
          build/appimage/AppDir/usr/bin/python3 -c '
          import os
          from importlib.metadata import version
          from packaging.version import Version
          actual = Version(version("naga-control"))
          expected = Version(os.environ["RELEASE_VERSION"])
          if actual != expected:
              raise SystemExit(f"Bundled package version {actual} != tag version {expected}")
          print(f"Bundled package version: {actual}")
          '

      - name: Verify and normalize AppImage output
        run: |
          ls -la dist
          test -f dist/Naga-Control-*-x86_64.AppImage
          cp dist/Naga-Control-*-x86_64.AppImage dist/Naga-Control-x86_64.AppImage

      - name: Generate SHA-256 sidecar
        working-directory: dist
        run: |
          sha256sum Naga-Control-x86_64.AppImage > Naga-Control-x86_64.AppImage.sha256
          cat Naga-Control-x86_64.AppImage.sha256

      - name: Check published versions before promotion
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$RUNNER_TEMP/published-tags.txt"
          .venv/bin/python scripts/prepare_release.py "$GITHUB_REF_NAME" \
            --published-tags "$RUNNER_TEMP/published-tags.txt" \
            --notes-output "$RUNNER_TEMP/release-notes.md"

      - name: Upload AppImage to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.promotion.outputs.prerelease }}
          LATEST: ${{ steps.promotion.outputs.latest }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null; then
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/Naga-Control-x86_64.AppImage \
            dist/Naga-Control-x86_64.AppImage.sha256 \
            --clobber
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false "--latest=$LATEST")
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
